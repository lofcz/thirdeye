[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eye3"
version = "1.0.0"
description = "Screen capture library bypassing WDA_MONITOR/WDA_EXCLUDEFROMCAPTURE (Windows x64 native binary)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Matěj \"lofcz\" Štágl" }]
keywords = ["screenshot", "screen-capture", "windows", "display-affinity", "native"]
requires-python = ">=3.8"
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/lofcz/thirdeye"
Repository = "https://github.com/lofcz/thirdeye"

[tool.setuptools]
packages = ["eye3"]
include-package-data = true

[tool.setuptools.package-data]
eye3 = ["*.dll"]
