<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>ThirdEye Demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #12141a;
      color: #e6e8ee;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
      padding: 24px;
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      margin: 0;
      letter-spacing: 0.4px;
    }
    p {
      margin: 0;
      font-size: 13px;
      color: #9aa1b0;
      max-width: 380px;
      text-align: center;
      line-height: 1.5;
    }
    .row { display: flex; gap: 12px; }
    button {
      background: #3d6ef5;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 18px;
      cursor: pointer;
      transition: background 120ms ease;
    }
    button:hover { background: #2f5be0; }
    button.secondary {
      background: #262a33;
      border: 1px solid #3a3f4c;
      color: #cdd2dc;
    }
    button.secondary:hover { background: #2f3440; }
    #status {
      font-size: 12px;
      font-family: Consolas, 'Courier New', monospace;
      color: #8fe08f;
      min-height: 16px;
      max-width: 440px;
      word-break: break-all;
      text-align: center;
    }
    #status.error { color: #ff7b7b; }
  </style>
</head>
<body>
  <h1>ThirdEye &mdash; Electron Demo</h1>
  <p>
    1. Launch the companion app &mdash; its window is protected with
    <code>WDA_EXCLUDEFROMCAPTURE</code>, so normal screenshots won't see it.<br />
    2. Press <strong>Capture screenshot</strong> &mdash; the capture bypasses the
    protection and the protected window appears in the saved JPEG.
  </p>
  <div class="row">
    <button id="spawn" class="secondary">Launch invisible app</button>
    <button id="spawn-elevated" class="secondary">Launch invisible app (admin)</button>
    <button id="capture">Capture screenshot</button>
  </div>
  <div id="status"></div>
  <script src="renderer.js"></script>
</body>
</html>
